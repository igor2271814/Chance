        <a
          class="brand"
          href="#top"
          aria-label="Дом хвостиков «ШАНС» — на главную"
          ><span class="brand__mark" aria-hidden="true">♥</span
          ><span>Дом хвостиков <b>«ШАНС»</b></span></a
        >
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="main-menu"

        >
          <span class="visually-hidden">Открыть меню</span><span></span
          ><span></span><span></span>
        </button>
        <nav
          class="main-nav"
          id="main-menu"

            <div class="animals-filters" aria-label="Фильтр животных">

                    Все
                </button>

                <button class="animals-filter" type="button" data-animal-filter="cat">
                    🐈 Кошки
                </button>

                <button class="animals-filter" type="button" data-animal-filter="dog">
                    🐕 Собаки
                </button>
            </div>

            <div class="animals-list" data-animals-list aria-live="polite"></div>

    <footer class="site-footer">
